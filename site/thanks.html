<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>You're on the list — NearBase</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#F8FAF8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.card{background:#fff;border:1px solid #d4ead8;border-radius:20px;padding:3rem 2.5rem;max-width:440px;text-align:center;box-shadow:0 4px 20px rgba(8,80,65,.06)}
h1{font-family:'Fraunces',serif;font-weight:600;color:#085041;font-size:1.6rem;margin:.75rem 0 .5rem}
h1 em{font-style:italic;font-weight:300;color:#1D9E75}
p{color:#6b6b67;font-size:.9rem;line-height:1.6;margin-bottom:1.5rem}
a{display:inline-block;background:#1D9E75;color:#fff;text-decoration:none;padding:.7rem 1.6rem;border-radius:100px;font-size:.875rem;font-weight:500}
a:hover{background:#085041}
.dot{width:48px;height:48px;border-radius:50%;background:#E1F5EE;display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin:0 auto}
</style>
</head>
<body>
<div class="card">
  <div class="dot">✓</div>
  <h1>You're on the list, <em>welcome aboard.</em></h1>
  <p>We'll email you when something actually matters near your base — a new school, a waitlist opening, a military discount. That's it.</p>
  <a href='/find'>Back to the school search →</a>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Compare saved schools — NearBase</title>
<meta name="description" content="Side-by-side distance, eligibility, ratio, cost, openings, and your private rating.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,300&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--g:#1D9E75;--dark:#085041;--mid:#0F6E56;--light:#E1F5EE;--border:#d4ead8;--text:#1a1a18;--muted:#6b6b67;--cream:#F8FAF8}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);line-height:1.5}
header{background:var(--dark);color:#fff;padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.logo{font-family:Fraunces,serif;font-size:1.25rem;font-weight:600;color:#fff;text-decoration:none}
.logo span{color:var(--g)}
header nav{display:flex;gap:1rem;flex-wrap:wrap}
header nav a{color:rgba(255,255,255,.86);font-size:.85rem;text-decoration:none}
main{max-width:1100px;margin:0 auto;padding:1.4rem 1rem 3rem}
h1{font-family:Fraunces,serif;font-weight:600;color:var(--dark);font-size:2rem;line-height:1.15}
h1 em{font-style:italic;font-weight:300;color:var(--g)}
.lead,.muted{color:var(--muted)}
.lead{margin:.35rem 0 1rem}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:1rem 1.1rem;margin:.85rem 0}
.toolbar{display:flex;gap:.75rem;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;gap:.2rem;font-size:.75rem;color:var(--muted)}
select{font:inherit;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:.45rem .6rem;background:#fff;min-width:12rem}
.picks{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.picks label{flex-direction:row;align-items:center;gap:.35rem;background:var(--cream);border-radius:100px;padding:.3rem .7rem;color:var(--text);font-size:.8rem}
.btn{background:var(--g);color:#fff;border:none;border-radius:100px;padding:.55rem 1rem;font:inherit;font-size:.85rem;font-weight:500;cursor:pointer}
.compare-scroll{overflow-x:auto}
table.compare{border-collapse:collapse;width:100%;min-width:640px;background:#fff}
table.compare th,table.compare td{border-bottom:1px solid var(--border);padding:.75rem .8rem;text-align:left;vertical-align:top;font-size:.88rem}
table.compare thead th{font-family:Fraunces,serif;color:var(--dark);font-size:1rem;background:var(--light)}
table.compare tbody th{color:var(--muted);font-weight:500;width:11rem}
.status{margin-top:.6rem;font-size:.84rem;color:var(--mid)}
.empty-compare{color:var(--muted)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:2px}
@media(max-width:700px){h1{font-size:1.6rem}}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">Near<span>Base</span></a>
  <nav>
    <a href="find.html">Find schools</a>
    <a href="my-tours.html">My tours</a>
    <a href="account.html">Account</a>
  </nav>
</header>
<main>
  <h1>Compare <em>saved schools</em></h1>
  <p class="lead">The shortlist is the hearts on Find. Distance uses the base you pick. Ratio, cost, and rating come from your private tour log when you are signed in. Openings are the public reports only.</p>
  <form id="compareForm" class="card">
    <div class="toolbar">
      <label>Distance to
        <select id="compareBase" aria-label="Base for distance"></select>
      </label>
      <button class="btn" type="submit">Update compare</button>
    </div>
    <div class="picks" id="picks"></div>
    <p class="status" id="compareStatus" role="status"></p>
  </form>
  <div class="card" id="compareTable"></div>
</main>
<script src="family-loop.js"></script>
<script src="match.js"></script>
<script src="directory.js"></script>
<script src="billing-config.js"></script>
<script src="account.js"></script>
<script src="compare.js"></script>
</body>
</html>

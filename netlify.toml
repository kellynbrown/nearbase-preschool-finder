# The public website is the site/ folder. The founder dashboard is not in
# that folder; Netlify serves it only through the password-checked function.
[build]
  # Writes the public Maps browser key into site/billing-config.js when
  # GOOGLE_MAPS_BROWSER_KEY is set. An empty key leaves the profile placeholder.
  command = "node scripts/write-maps-config.js"
  publish = "site"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/admin.html", "site/schools.js"]

[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/admin"
  status = 200
  force = true

[[redirects]]
  from = "/admin/"
  to = "/.netlify/functions/admin"
  status = 200
  force = true

[[redirects]]
  from = "/admin.html"
  to = "/.netlify/functions/admin"
  status = 200
  force = true
